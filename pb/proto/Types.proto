  TrdMarket_JP_Fund = 126; //日本基金市场
}

//可交易证券所属市场，目前主要是区分A股的沪市和深市，香港和美国暂不需要细分
enum TrdSecMarket {
  TrdSecMarket_Unknown = 0; //未知市场
  TrdSecMarket_HK = 1; //香港市场(股票、窝轮、牛熊、期权、期货等)
