enum TrdMarket {
  TrdMarket_Unknown = 0; //未知市场
  TrdMarket_HK = 1; //香港市场
  TrdMarket_US = 2; //美国市场
  TrdMarket_CN = 3; //大陆市场
  TrdMarket_HKCC = 4; //香港A股通市场
