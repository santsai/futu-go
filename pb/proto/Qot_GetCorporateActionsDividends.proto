syntax = "proto2";
package futupb;

import "Types.proto";

option go_package = "github.com/santsai/futu-go/pb";

// 分红派息单条记录
message DividendItem {
  optional string pubDate = 1; // 公告日，格式 YYYY/MM/DD，对应市场时区
  optional string statement = 2; // 分配方案描述，如"末期息5.3港元"
  optional string process = 3; // 事件进展，如"方案实施"/"预案"；仅港股和A股的正股与信托有值
  optional string recordDate = 4; // 股权登记日，格式 YYYY/MM/DD，对应市场时区。ETF无此数据
  optional string exDate = 5; // 除权除息日，格式 YYYY/MM/DD，对应市场时区
  optional string dividendPayableDate = 6; // 派息日，格式 YYYY/MM/DD，对应市场时区
  optional string fiscalYear = 7; // 财政年度,如“2026”。仅ETF有值。
}

message QotGetCorporateActionsDividendsRequest {
  required Security security = 1; // 股票
}

message QotGetCorporateActionsDividendsResponse {
  repeated DividendItem dividendList = 1; // 分红派息列表，按公告日倒序排列
}

message QotGetCorporateActionsDividendsRequest_Internal {
  required QotGetCorporateActionsDividendsRequest payload = 1;
}

message QotGetCorporateActionsDividendsResponse_Internal {
  required RetType retType = 1 [default = RetType_Unknown]; //RetType,返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;

  optional QotGetCorporateActionsDividendsResponse payload = 4;
}
