syntax = "proto2";
package futupb;

import "Types.proto";

option go_package = "github.com/santsai/futu-go/pb";

message QotUpdateRTResponse {
  required Security security = 1;
  optional string name = 3; //股票名称
  repeated TimeShare rtList = 2; //推送的分时点
}

message QotUpdateRTResponse_Internal {
  required RetType retType = 1 [default = RetType_Unknown]; //RetType,返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;

  optional QotUpdateRTResponse payload = 4;
}
