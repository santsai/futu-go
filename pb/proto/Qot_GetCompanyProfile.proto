syntax = "proto2";
package futupb;

import "Types.proto";

option go_package = "github.com/santsai/futu-go/pb";

// 公司详情标签项
message CompanyLabItem {
  optional string name = 1; // 标签名
  optional string value = 2; // 标签对应信息
  optional CompanyProfileFieldType fieldType = 3; // 标签类型（详见 Qot_Common.CompanyProfileFieldType 定义）
}

message QotGetCompanyProfileRequest {
  required Security security = 1; // 股票
}

message QotGetCompanyProfileResponse {
  repeated CompanyLabItem itemList = 1; // 公司详情标签列表
}

message QotGetCompanyProfileRequest_Internal {
  required QotGetCompanyProfileRequest payload = 1;
}

message QotGetCompanyProfileResponse_Internal {
  required RetType retType = 1 [default = RetType_Unknown];
  optional string retMsg = 2;
  optional int32 errCode = 3;
  optional QotGetCompanyProfileResponse payload = 4;
}
