syntax = "proto2";
package futupb;

import "Types.proto";

option go_package = "github.com/santsai/futu-go/pb";

message QotUpdateBasicQotResponse {
  repeated BasicQot basicQotList = 1; //股票基本行情
}

message QotUpdateBasicQotResponse_Internal {
  required RetType retType = 1 [default = RetType_Unknown]; //RetType,返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;

  optional QotUpdateBasicQotResponse payload = 4;
}
