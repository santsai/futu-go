syntax = "proto2";
package futupb;

import "Types.proto";

option go_package = "github.com/santsai/futu-go/pb";

message QotRequestRehabRequest {
  required Security security = 1; //股票
  optional QotHeader header = 100; //行情公共参数头
}

message QotRequestRehabResponse {
  repeated Rehab rehabList = 1; //复权信息
}

message QotRequestRehabRequest_Internal {
  required QotRequestRehabRequest payload = 1;
}

message QotRequestRehabResponse_Internal {
  required RetType retType = 1 [default = RetType_Unknown]; //RetType,返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;

  optional QotRequestRehabResponse payload = 4;
}
